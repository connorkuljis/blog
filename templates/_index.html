<!-- index.html -->
<!doctype html>

<html lang="en">

{{ template "head" . }}

<body class="layout">
	<!-- header -->
	{{ template "header" . }}

	<!-- breadcrumbs -->
	<nav id="breadcrumbs" class="breadcrumbs container">
		<ul role="list">
			<li><a href="/">Home</a></li>
		</ul>
	</nav>

	<!-- main -->
	<main id="index" class="main wrapper container">
		<h1>Connor Kuljis' Website</h1>
		<details open>
			<summary>Nerd Statistics</summary>
			{{ template "nerd-stats" . }}
		</details>
		<div>
			{{ template "bio" . }}
		</div>
	</main>

	<!-- footer -->
	{{ template "footer" . }}
</body>

</html>
