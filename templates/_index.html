<!-- index.html -->
<!doctype html>
<html lang="en">
<!-- head -->
{{ template "head" . }}

<body>
	<!-- header -->
	{{ template "header" . }}

	<!-- main -->
	<main>
		<section class="about">
			{{ template "about" . }} 
		</section>

			{{ range .Categories }}
			<!-- nowrap -->
			{{ $category := .Title }}
			<section class="category" id="{{ slugify $category }}">
				<h3>{{ .Title }}</h3>
				{{ range .Entries }}
				<a href="/{{ slugify $category }}/{{ slugify .Title }}">{{ .Title }}</a>
				<p>{{ .Markdown }}</p>
				{{ end }}
			</section>
			{{ end }}
	</main>
</body>

</html>

{{ define "about" }}
<p>I'm Connor and this is my website. Welcome!</p>
{{ end }}
