{{ define "head" }}

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<title>{{ .Site.Config.Title }} | {{ .Title }}</title>

	<link rel="icon" href="/images/icon.png" />
	
	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
	
	<link rel="stylesheet" href="/css/styles.css?v={{ .Site.CreatedAt.Format `150405`}}" />

	<script>
		/*this is an immediately invoked function to prevent Firefox FOUC, this must be here*/
		(_ => {
			let FF_FOUC_FIX;
		})();
	</script>
	<script src="/js/table-of-contents.js"></script>
</head>
{{ end }}
