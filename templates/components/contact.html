{{ define "contact" }}
<section class="contact">
	<h3>Contact</h3>

	{{- if .Site.Config.Socials }}
	<div>
		{{- template "socials-list" . }}
	</div>
	{{- end }}
</section>
{{ end }}

{{ define "socials-list" }}
<ul role="list" class="socials-list">
	{{- range .Site.Config.Socials }}
	<li><a href="{{ .URL }}">{{ .Name }}</a></li>
	{{- end }}
</ul>
{{ end }}
