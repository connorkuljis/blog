{{ define "page-hue-styles" }}
{{ if eq .Category.Title "Blog" }}
<style>
	:root {
		--page-hue: 60;
	}
</style>
{{ end}}
{{ if eq .Category.Title "TIL" }}
<style>
	:root {
		--page-hue: 120;
	}
</style>
{{ end}}
{{ if eq .Category.Title "Projects" }}
<style>
	:root {
		--page-hue: 360;
	}
</style>
{{ end}}
{{ end }}
