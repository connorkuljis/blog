{{ define "root" }}
<!DOCTYPE html>
<html lang="en">

<!-- head -->
{{ template "head" .}}

<!-- root -->

<body class="root">
	<!-- grid -->
	<div class="grid-wrapper">
		<!-- header -->
		{{ template "header" . }}

		<!-- view -->
		<main class="view-wrapper">
			{{ template "view" . }}
		</main>

		<!-- footer -->
		{{ template "footer" . }}
	</div>
</body>

</html>
{{ end }}
