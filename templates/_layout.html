{{ define "root" }}
<!DOCTYPE html>
<html lang="en">

{{ template "head" .}}

<body id="_layout" class="root">
	<div class="layout">
		{{ template "header" . }}

		<main class="main">
			<h1> {{ .Title }} </h1>

			{{ template "view" . }}
		</main>

		{{ template "footer" . }}
	</div>
</body>

</html>
{{ end }}
