{{ define "root" }}
<!DOCTYPE html>
<html lang="en">

{{ template "head" .}}

<body id="root" class="layout">
	{{ template "header" . }}

	<main class="main">
		<article class="article">
			<header>
				<h1> {{ .Title }} </h1>
			</header>
			{{ template "view" . }}
		</article>
	</main>
</body>

</html>
{{ end }}
