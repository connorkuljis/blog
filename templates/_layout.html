{{ define "root" }}
<!DOCTYPE html>
<html lang="en">

<!-- head -->
{{ template "head" .}}

<!-- root -->

<body class="root">
	<!-- layout -->
	<div class="layout">

		<!-- header -->
		{{ template "header" . }}

		<!-- main -->
		<main class="main">
			<!-- wrapper -->
			<div class="wrapper">
				<!-- article -->
				<article class="article">

					<!-- header -->
					<header class="header">
						<h1>{{ .Title }}</h1>
					</header>

					<!-- view -->
					<div class="view">
						{{ template "view" . }}
					</div>
				</article>
			</div>
		</main>

		<!-- footer -->
		{{ template "footer" . }}
	</div>
</body>

</html>
{{ end }}
