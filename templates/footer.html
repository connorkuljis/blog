{{ define "footer" }}
<footer class="footer" id="kuljis-footer">
	<div class="wrapper">
		<div>
			{{ .Site.Title }}
		</div>
		<div class="nerd-stats">
			{{ .Site.NerdStats.Platform }}
		</div>
	</div>
</footer>
{{ end }}

{{ define "footer-debug" }}
<footer class="footer" id="kuljis-footer">
	<details>
		<summary>debug</summary>
		<pre><code>{{ . }}</code></pre>
	</details>
</footer>
{{ end }}
