<!-- view-entry.html -->
<!doctype html>
<html lang="en">
  {{ template "head" . }}
  <body class="wrapper">
    <!-- header -->
    {{ template "site-header" . }}

    <!-- main -->
    <main>
      <article class="content" id="{{ slugify .Entry.Title }}">
        <h1 class="title">{{ .Entry.Title }}</h1>
        {{ .Content }}
      </article>
    </main>
  </body>
</html>
