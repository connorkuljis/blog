<!-- entry.html -->
<!doctype html>
<html lang="en">
  <!-- head -->
  {{ template "head" . }}

  <body>
    <!-- header -->
    {{ template "header" . }}

    <!-- main -->
    <main class="container">
      <hgroup>
        <h1>{{ .Entry.Title }}</h1>
        <p>{{ .Entry.CreatedAt.Format "Jan 02, 2006"}}</p>
      </hgroup>
      <div>{{ .Content }}</div>
    </main>
  </body>
</html>
