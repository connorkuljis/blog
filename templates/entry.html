<!-- entry.html -->
<!doctype html>
<html lang="en">
  <!-- head -->
  {{ template "head" . }}

  <body>
    <!-- header -->
    {{ template "site-header" . }}

    <!-- main -->
    <main>
      <article id="{{ slugify .Entry.Title }}">
        <h1>{{ .Entry.Title }}</h1>
        <div class="markdown">{{ .Content }}</div>
      </article>
    </main>
  </body>
</html>
