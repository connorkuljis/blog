<!-- entry.html -->
<!doctype html>
<html lang="en">
  <!-- head -->
  {{ template "head" . }}

  <body class="body">
    <!-- header -->
    {{ template "site-header" . }}

    <!-- main -->
    <main class="main">
      <article class="entry" id="{{ slugify .Entry.Title }}">
        <h1 class="title">{{ .Entry.Title }}</h1>
        <div class="subtitle">{{ .Entry.CreatedAt.Format "Jan 02, 2006"}}</div>
        <div class="markdown">{{ .Content }}</div>
      </article>
    </main>
  </body>
</html>
