{{ define "view" }}
<section class="content">
  <a href="/{{ slugify .Entry.CategoryTitle}}"
    >back to {{ .Entry.CategoryTitle }}</a
  >
  <article class="content">
    <header>
      <h1 class="heading">{{ .Entry.Title }}</h1>
      {{ $timestamp := .Entry.CreatedAt.Format "2006-01-02"}}
      <div class="subtitle">
        <time datetime="{{ $timestamp }}">{{ $timestamp }}</time>
      </div>
    </header>
    <div class="markdown">{{ .Content }}</div>
  </article>
</section>
{{ end }}
