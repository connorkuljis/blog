<!-- entry.html -->
<!doctype html>
<html lang="en">
<!-- head -->
{{ template "head" . }}

<body>
	<!-- header -->
	{{ template "header" . }}

	<div class="grid">
		<!-- main -->
		<main class="main">
			<div class="owl">
				<h1>{{ .CurrentEntry.Title }}</h1>
				<div>{{ .CurrentEntry.CreatedAt.Format "Jan 02, 2006"}}</div>

				<div class="owl">
					{{ .CurrentEntry.Markdown }}
				</div>
			</div>
		</main>
	</div>
</body>

</html>
