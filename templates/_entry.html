<!-- entry.html -->
<!doctype html>
<html lang="en">
<!-- head -->
{{ template "head" . }}

<body>
	<!-- header -->
	{{ template "header" . }}

	<!-- main -->
	<main class="container">
		<h1 class="title">{{ .CurrentEntry.Title }}</h1>
		<p class="subtitle">
			{{ .CurrentEntry.CreatedAt.Format "Jan 02, 2006"}}
		</p>
		<div class="markdown">{{ .CurrentEntry.Markdown }}</div>
	</main>
</body>

</html>

{{ define "back" }}
<!-- nowrap -->
{{ $slug := slugify .Category.Title }}
<a href="/{{ $slug }}">back to {{ $slug }}</a>
{{ end }}
