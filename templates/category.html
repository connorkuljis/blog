<!-- category.html -->
<!doctype html>
<html lang="en">
  {{ template "head" . }}

  <body class="wrapper">
    <!-- header -->
    {{ template "site-header" . }}

    <!-- main -->
    <main>
      <h1>{{ .Category.Title }}</h1>
      <span class="subtitle">{{ .Category.Description }}</span>
      <ul role="list">
        {{ $categorySlug := slugify .Category.Title }}
        <!-- nowrap -->
        {{ range .Entries }}
        <li>
          <a href="/{{ $categorySlug }}/{{ slugify .Title }}">{{ .Title }}</a>
        </li>
        {{ end }}
      </ul>
    </main>
  </body>
</html>
