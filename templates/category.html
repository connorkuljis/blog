<!-- category.html -->
<!doctype html>
<html lang="en">
  {{ template "head" . }}
  <body class="wrapper">
    <!-- main -->
    <main class="main">
      <h1 class="title">{{ .Category.Title }}</h1>
      <span class="subtitle">{{ .Category.Description }}</span>
      <ul role="list">
        {{ $categorySlug := slugify .Category.Title }}
        <!-- nowrap -->
        {{ range .Entries }}
        <!-- -->
        {{ $entrySlug := slugify .Title }}
        <li>
          <a href="/{{ $categorySlug }}/{{ $entrySlug }}">{{ .Title }}</a>
        </li>
        {{ end }}
      </ul>
    </main>
  </body>
</html>
