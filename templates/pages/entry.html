{{ define "view" }}
<p>
	<time>
		{{ .Entry.CreatedAt.Format "January 02, 2006"}}
	</time>
</p>

<main class="markdown">
	{{ .Entry.Markdown }}
</main>

<footer>
	<div>
		{{ range .Entry.Tags }}
		<a href="{{ .Permalink }}">{{ .Name }}</a>
		{{ end }}
	</div>

	<div class="read-more">
		<h3>Read More</h3>
		{{ if .Prev }}
		{{ template "entry-preview" .Prev }}
		{{ end }}

		{{ if .Next }}
		{{ template "entry-preview" .Next }}
		{{ end }}
	</div>
</footer>
{{ end }}
