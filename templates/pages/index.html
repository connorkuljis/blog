{{ define "view" }}
<section>
	{{- template "email-list-form" . }}
</section>

<section>
	{{- template "about" . }}
</section>

<section>
	{{- if .Site.RecentEntries }}
	<h3>Recent Posts</h3>
	<ul>
		{{- range .Site.RecentEntries }}
		<li>
			{{- template "entry-preview" . }}
		</li>
		{{- end }}
	</ul>
	{{- end }}

	<div>
		<p>
			<a href="/archive/">View full archive →</a>
		</p>
	</div>
</section>
{{ end }}
