{{ define "view" }}
<article>
	<header>
		<h2>{{ .Tag.Name }}</h2>
		<h3>Entries tagged with "{{ .Tag.Name }}"</h3>
		<p>({{ len .Tag.Entries }}) entries</p>
	</header>

	<main>
		<div>
			<ul>
				{{ range .Tag.Entries }}
				<li>
					{{ template "entry-preview" . }}
				</li>
				{{ end }}
			</ul>
		</div>
	</main>
</article>
{{ end }}
