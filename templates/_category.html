<!-- category.html -->
<!doctype html>
<html lang="en">
<!-- head -->
{{ template "head" . }}

<body id="_category" class="page-wrapper">
	{{ template "header" . }}

	<main class="main">
		<div class="wrapper">
			<div class="content-grid">
				<article class="article">
					<header class="article-header">
						<h1>{{ .Category.Title }}</h1>
						<h2>{{ .Category.Description }}</h2>
					</header>

					<section>
						<ul class="category-entries-list">
							{{ range $i, $e := .Category.Entries }}
							<li>
								<article>
									<time class="datetime">{{ $e.CreatedAt.Format "2006-01-02" }}</time>
									<a href="{{ $e.Permalink }}">
										{{ $e.Title }}
									</a>
								</article>
							</li>
							{{ end }}
						</ul>
					</section>
				</article>
			</div>
		</div>
	</main>

	{{ template "footer" . }}
</body>

</html>
