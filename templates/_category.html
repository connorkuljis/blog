<!-- category.html -->
<!doctype html>
<html lang="en">
<!-- head -->
{{ template "head" . }}

<body>
	<!-- header -->
	{{ template "header" . }}

	<!-- main -->
	<main class="main flex-col" gap="2">
		<nav class="wrapper">
			<ul role="list">
				<li><a href="/">home</a></li>
				<span>&#8594;</span>
				<li><a href="/{{ .Category.Slug }}">{{ slugify .Category.Title }}</a></li>
			</ul>
		</nav>

		<div class="wrapper">
			<h1 class="heading">{{ .Category.Title }}</h1>
			<h2 class="subheading">{{ .Category.Description }}</h2>
		</div>

		<div class="wrapper">
			<ul class="list">
				{{ range .Category.Entries }}
				<li>
					<span><a href="/{{ .Slug }}">{{ .Title }}</a> {{ .CreatedAt.Format "2006 Jan 2" }}</span>
				</li>
				{{ end }}
			</ul>
		</div>
	</main>
</body>

</html>
