<!-- category.html -->
<!doctype html>
<html lang="en">
<!-- head -->
{{ template "head" . }}

<body>
	<!-- header -->
	{{ template "header" . }}

	<div class="grid">
		{{ template "aside" . }}

		<!-- main -->
		<main class="main">
			<div class="owl">
				<h1>{{ .Category.Title }} | {{ .Category.Description }}</h1>

				<div>
					<ul role="list">
						{{ $category := slugify .Category.Title }}
						{{ range .Category.Entries }}
						{{ $title := slugify .Title }}
						<li>
							<a href="/{{ $category }}/{{ $title }}">{{ .Title }}</a>
						</li>
						{{ end }}
					</ul>
				</div>
			</div>
		</main>
	</div>
</body>

</html>
