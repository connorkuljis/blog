<!-- category.html -->
<!doctype html>
<html lang="en">
<!-- head -->
{{ template "head" . }}

<body id="category">
	{{ template "header" . }}

	<main class="main">
		<div class="wrapper">
			<article class="article">
				<header class="article-header">
					<h1>{{ .Category.Title }}</h1>
					<h2>{{ .Category.Description }}</h2>
				</header>

				<table>
					{{ range $i, $e := .Category.Entries }}
					<tr>
						<td>
							<time class="datetime">{{ $e.CreatedAt.Format "2006-01-02" }}</time>
						</td>
						<td>
							<a href="{{ $e.Permalink }}">
								{{ $e.Title }}
							</a>
						</td>
					</tr>
					{{ end }}
				</table>

			</article>
		</div>
		<!-- ./wrapper -->
	</main>

	{{ template "footer" . }}
</body>

</html>
