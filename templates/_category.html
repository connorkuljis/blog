<!-- category.html -->
<!doctype html>
<html lang="en">
<!-- head -->
{{ template "head" . }}

<body id="_category" class="page-wrapper">
	{{ template "header" . }}

	<main class="main">
		<div class="wrapper">
			<article class="article">
				<header class="article-header">
					<h2 class="title">{{ .Category.Title }}</h2>
					<h3 class="subheading">{{ .Category.Description }}</h3>
				</header>

				<main class="article-main">
					<ul class="category-entries-list">
						{{ range $i, $e := .Category.Entries }}
						<li>
							<article class="entry-item">
								<time class="entry-created-at">{{ $e.CreatedAt.Format "January 02, 2006" }}</time>
								<h3 class="entry-title">
									<a href="{{ $e.Permalink }}">
										{{ $e.Title }}
									</a>
								</h3>
							</article>
						</li>
						{{ end }}
					</ul>
					</section>
			</article>
		</div>
	</main>

	{{ template "footer" . }}
</body>

</html>
