<!-- category.html -->
<!doctype html>
<html lang="en">
<!-- head -->
{{ template "head" . }}

<body>
	<!-- header -->
	{{ template "header" . }}

	<!-- main -->
	<main class="main flex-col" gap="2">
		{{ $category := slugify .Category.Title }}
		<nav class="wrapper">
			<ul role="list">
				<li><a href="/">home</a></li>
				<span>/</span>
				<li><a href="/{{ $category }}">{{ $category }}</a></li>
			</ul>
		</nav>

		<div class="wrapper">
			<h1 class="heading">{{ .Category.Title }}</h1>
			<h2 class="subheading">{{ .Category.Description }}</h2>
		</div>

		<div class="wrapper">
			<ul role="list">
				{{ range .Category.Entries }}
				{{ $title := slugify .Title }}
				<li>
					<a href="/{{ $category }}/{{ $title }}">{{ .Title }}</a>
				</li>
				{{ end }}
			</ul>
		</div>
	</main>
</body>

</html>
