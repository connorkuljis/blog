<!-- index.html -->
<!doctype html>
<html lang="en">
  <!-- head -->
  {{ template "head" . }}

  <body>
    <!-- header -->
    {{ template "header" . }}
    <!-- ./header -->

    <!-- main -->
    <main class="container">
      <hgroup>
        <h1 class="title">Recent Entries</h1>
      </hgroup>

      <section>
        <!-- entries -->
        <ul>
          {{ range .Site.Entries }}
          <li>
            <h3>
              <a href="/{{ slugify .Title }}">{{ .Title }}</a>
            </h3>
          </li>
          {{ end }}
          <!-- ./entries -->
        </ul>
      </section>
    </main>
    <!-- ./main -->
  </body>
</html>
