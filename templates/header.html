<header class="header" id="kuljis-header">
	<!-- wrapper -->
	<div class="header-wrapper">
		<!-- nav -->
		<nav class="nav" id="kuljis-nav">
			<!-- home link -->
			<div><a href="/">Home</a></div>

			<!-- hamburger button -->
			<button class="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="categories-list">
				<span class="hamburger-box">
					<span class="hamburger-inner"></span>
				</span>
			</button>

			<!-- categories-list -->
			<ul class="categories-list" id="categories-list">
				<li><a href="/about">About</a></li>
				<li><a href="/tags">Tags</a></li>
				{{- range $_, $category := .Site.Categories }}
				<li><a href="{{ $category.Permalink }}">{{ $category.Title }}</a></li>
				{{- end }}
			</ul>
		</nav>
	</div>
</header>
