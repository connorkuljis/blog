!-- header -->
{{ define "header" }}
<header class="header" id="kuljis-header">
	<!-- wrapper -->
	<div class="header-wrapper">
		<!-- nav -->
		<nav class="nav" id="kuljis-nav">
			<!-- home link -->
			<div><a href="/">Home</a></div>

			<!-- categories-list -->
			<ul class="categories-list">
				<li><a href="/about">About</a></li>
				{{- range $_, $category := .Site.Categories }}
				<li><a href="{{ $category.Permalink }}">{{ $category.Title }}</a></li>
				{{- end }}
			</ul>
		</nav>
	</div>
</header>
{{ end }}
