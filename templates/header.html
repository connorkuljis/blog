{{ define "header" }}
<header class="header">
	<!-- wrapper -->
	<div class="wrapper">
		<!-- nav -->
		<nav class="nav">
			<div>
				<ul role="list">
					<li>
						<a href="/"> {{ .Site.Config.Domain }} </a>
					</li>
				</ul>
			</div>
			<div>
				<ul role="list">
					<li><a href="/about">About</a></li>
					{{- range .Site.Categories }}
					<li><a href="{{ .Permalink }}">{{ .Title }}</a></li>
					{{- end }}
				</ul>
			</div>
		</nav>
	</div>
</header>
{{ end }}
