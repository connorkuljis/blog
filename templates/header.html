<!-- header -->
{{ define "header" }}
<header class="site-header container">
	<div class="site-title">
		<a href="/">Oaku's Weblog</a>
	</div>

	<nav class="site-nav">
		<ul role="navigation">
			{{ $n := len .Site.Categories }}
			{{ range $i, $category := .Site.Categories }}
			<li>
				<a href="/{{ $category.Slug }}">{{ $category.Title }}</a>
			</li>
			<!-- add a separator if not the last item -->
			{{ if not (eq (sub $n 1) $i) }}
			<!-- <span> • </span> -->
			{{ end }}
			{{ end }}
		</ul>
	</nav>
</header>
{{ end }}
