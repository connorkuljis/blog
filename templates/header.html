{{ define "header" }}
<header class="header">
	<!-- nav -->
	<nav class="nav">
		<!-- site-list -->
		<ul role="list">
			<li>
				<a href="/"> {{ .Site.Config.Domain }} </a>
			</li>
		</ul>

		<!-- categories-list -->
		<ul role="list">
			<li><a href="/about">About</a></li>
			{{- range .Site.Categories }}
			<li>
				<a href="{{ .Permalink }}">{{ .Title }}</a>
			</li>
			{{- end }}
		</ul>
	</nav>
</header>
{{ end }}
