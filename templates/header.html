<!-- header -->
{{ define "header" }}
<header class="site-header container">
	<div class="site-title">
		<a href="/">Oaku's Weblog</a>
	</div>

	<nav class="site-nav">
		{{ template "nav-items" . }}
	</nav>
</header>
{{ end }}

{{ define "nav-items" }}
<ul role="navigation">
	{{ $n := len .Site.Categories }}
	{{ range $i, $category := .Site.Categories }}
	<li>
		<a href="{{ $category.Permalink }}">
			{{ $category.Title }}
		</a>
	</li>
	{{ end }}
</ul>
{{ end }}
